name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # SEMUA BUILD DI LINUX UNTUK CEPAT & STABIL
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-windows-x64-baseline
          - bun-linux-x64-baseline
          - bun-linux-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Compile Binary
        run: bun run compile --target=${{ matrix.target }}

      - name: Package Artifact
        run: |
          mkdir -p artifacts
          TARGET="${{ matrix.target }}"
          
          if [[ "$TARGET" == *"windows"* ]]; then
            cd build
            zip -r ../artifacts/pkm-posyandu-${TARGET}.zip pkm-posyandu-${TARGET}.exe
          else
            cd build
            tar -czvf ../artifacts/pkm-posyandu-${TARGET}.tar.gz pkm-posyandu-${TARGET}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkm-posyandu-${{ matrix.target }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract Latest Changelog
        id: changelog
        run: |
          CHANGELOG=$(awk '/^## \[/{count++} count==1{print} count==2{exit}' CHANGELOG.md)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false