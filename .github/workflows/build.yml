name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: bun-windows-x64
            artifact_name: pkm-posyandu-windows-x64
            archive_ext: zip
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact_name: pkm-posyandu-linux-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact_name: pkm-posyandu-linux-arm64
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build & Compile
        run: bun run compile --target=${{ matrix.target }}
        env:
          BUN_DOWNLOAD_TIMEOUT: "600"

      - name: Set executable permission (Unix only)
        if: matrix.target != 'bun-windows-x64'
        run: |
          chmod +x build/pkm-posyandu-${{ matrix.target }}
          ls -la build/

      - name: Rename binary (Windows)
        if: matrix.target == 'bun-windows-x64'
        run: mv build/pkm-posyandu-bun-windows-x64.exe build/pkm-posyandu.exe
        shell: bash

      - name: Rename binary (Unix)
        if: matrix.target != 'bun-windows-x64'
        run: mv build/pkm-posyandu-${{ matrix.target }} build/pkm-posyandu
        shell: bash

      - name: Create archive (Windows - zip)
        if: matrix.archive_ext == 'zip'
        run: |
          cd build
          7z a ../${{ matrix.artifact_name }}.zip pkm-posyandu.exe
        shell: bash

      - name: Create archive (Unix - tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          cd build
          tar -czvf ../${{ matrix.artifact_name }}.tar.gz pkm-posyandu
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract latest changelog
        id: changelog
        run: |
          echo "🚀 Binaries terbaru untuk PKM Posyandu. Silakan download sesuai sistem operasi Anda di bagian bawah." > release_notes.md
          echo "" >> release_notes.md
          echo "## 📝 Changelog" >> release_notes.md
          # Ambil entry paling atas dari CHANGELOG.md sampai entry kedua
          awk '/^## \[/{flag++} flag==1{print} flag==2{exit}' CHANGELOG.md >> release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          fail_on_unmatched_files: false